        title: "Portada Oficial",
        chapter: "CAP. 3: HISTORIAS OSCURAS",
        img: "https://lh3.googleusercontent.com/aida-public/AB6AXuCqTG7TpU_Ny0ZADspDcEcVWEqQjrXHMowXepQT_nGdwVuq3AqER8FPZ-RmqTWdL-nkh7BWeAcpMgy0KEmazxmLifPSsoWgBDz7IebuWk8wORVIFKQ8WaigU6H3YyKUlzyAdrRnTjazHYtgu3eLWFjLsS_t_cJzvzDyf6nO4ogjhJbur8yNIC4z94aDj_tXPYCDQOkktfoYeWP20dvc7CpK4vBwXcN0pOwipMVKnnHLAhFuWSXy6BrbPleAVhHQhb5fOA"
      },
      {
        page: 2,
        title: "El Templo de Xylos",
        chapter: "CAP. 3: HISTORIAS OSCURAS",
        img: "https://lh3.googleusercontent.com/aida/AEtjO1X8urLLjdtiG6LngKYtja_JpP8Xw_pM5lKtN2gChurapCo8eVvAY_Lo6VL85RKurkkN-wL-nXIc_7WlMJVTlS3UUr1g9-9IzWQb3hRMmm4FWFKcHMxpF1aWDINHW5DfnyUFDPi-u05BC8WyfpLUEGhub_zFsKFdSva27Sr6QdJo-XC6frjKawWLHk6SCbJK5jDjdi1Y-FrheA3xvWFZxkdcJlf3JprIpZENxgYY_bwxelzZJqUUn7zith8"
      },
      {
        page: 3,
        title: "El Señor de las Sombras",
        chapter: "CAP. 3: HISTORIAS OSCURAS",
        img: "https://lh3.googleusercontent.com/aida/AEtjO1XwPBGL-MhrzjZGy8HywPKU1PQQTPKvhnMlOlw-SXbot8ugAey6Pozn35fO2WIdPF6z7TriR9rq_sHKOQl1kNJ7p0COInJxr-lQUDAsMih44ph4KChWR7YaWptU4MGyRhxaHu46m57IXGKt34llmlDK80VRYbddq4yW_BEDgLwYNaxjC1k4Ur_uyZIMHRNwjbVmvFRX6Ejp5dZm8XLsLkvJ0PFgiv9ymR7CB1_fEhpzUbCrbGi-Igm23Cg"
      }
    ];

    const totalPages = 24;
    let currentPage = 1;
    let currentZoom = 1;
    let areHudVisible = true;
    let autoplayInterval = null;

    // DOM Elements
    const topHud = document.getElementById('top-hud');
    const bottomHud = document.getElementById('bottom-hud');
    const zoomControls = document.querySelector('[data-purpose="floating-zoom-buttons"]');
    const comicZoomContainer = document.getElementById('comic-zoom-container');
    const comicSheet = document.getElementById('comic-sheet');
    const comicPageImg = document.getElementById('comic-page-img');
    const sheetPageLabel = document.getElementById('sheet-page-label');
    const pageSlider = document.getElementById('page-slider');
    const headerPageCurr = document.getElementById('header-page-curr');
    const headerChapterName = document.getElementById('header-chapter-name');
    const bottomPageLabel = document.getElementById('bottom-page-label');
    const toast = document.getElementById('reader-toast');
    const settingsModal = document.getElementById('settings-modal');
    const btnSettingsModal = document.getElementById('btn-settings-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const modalJumpInput = document.getElementById('modal-jump-input');
    const modalBtnJump = document.getElementById('modal-btn-jump');
    const btnAutoplay = document.getElementById('btn-autoplay');
    const autoplayText = document.getElementById('autoplay-text');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove('opacity-0', 'scale-90');
      toast.classList.add('opacity-100', 'scale-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'scale-100');
        toast.classList.add('opacity-0', 'scale-90');
      }, 1000);
    }

    function updatePage(newPage) {
      if (newPage < 1) newPage = 1;
      if (newPage > totalPages) newPage = totalPages;
      currentPage = newPage;

      comicSheet.style.opacity = '0.4';
      comicSheet.style.transform = 'scale(0.98)';

      setTimeout(() => {
        const pageData = comicPages.find(p => p.page === currentPage);
        if (pageData) {
          comicPageImg.src = pageData.img;
          sheetPageLabel.textContent = `PÁG. ${currentPage} - ${pageData.title}`;
          headerChapterName.textContent = pageData.chapter;
        } else {
          // Si avanza más allá de la 3, alterna fluidamente entre páginas interiores
          const fallback = (currentPage % 2 === 0) ? "https://lh3.googleusercontent.com/aida/AEtjO1X8urLLjdtiG6LngKYtja_JpP8Xw_pM5lKtN2gChurapCo8eVvAY_Lo6VL85RKurkkN-wL-nXIc_7WlMJVTlS3UUr1g9-9IzWQb3hRMmm4FWFKcHMxpF1aWDINHW5DfnyUFDPi-u05BC8WyfpLUEGhub_zFsKFdSva27Sr6QdJo-XC6frjKawWLHk6SCbJK5jDjdi1Y-FrheA3xvWFZxkdcJlf3JprIpZENxgYY_bwxelzZJqUUn7zith8" : "https://lh3.googleusercontent.com/aida/AEtjO1XwPBGL-MhrzjZGy8HywPKU1PQQTPKvhnMlOlw-SXbot8ugAey6Pozn35fO2WIdPF6z7TriR9rq_sHKOQl1kNJ7p0COInJxr-lQUDAsMih44ph4KChWR7YaWptU4MGyRhxaHu46m57IXGKt34llmlDK80VRYbddq4yW_BEDgLwYNaxjC1k4Ur_uyZIMHRNwjbVmvFRX6Ejp5dZm8XLsLkvJ0PFgiv9ymR7CB1_fEhpzUbCrbGi-Igm23Cg";
          comicPageImg.src = fallback;
          sheetPageLabel.textContent = `PÁG. ${currentPage} DE ${totalPages}`;
        }
        comicSheet.style.opacity = '1';
        comicSheet.style.transform = 'scale(1)';
      }, 80);

      headerPageCurr.textContent = currentPage;
      bottomPageLabel.textContent = currentPage;
      pageSlider.value = currentPage;
      modalJumpInput.value = currentPage;
    }

    function advanceNextPage() {
      if (currentPage < totalPages) {
        updatePage(currentPage + 1);
        showToast(`Página ${currentPage}`);
      } else {
        updatePage(1);
        showToast("Volviendo al inicio (Pág. 1)");
      }
    }

    function retreatPrevPage() {
      if (currentPage > 1) {
        updatePage(currentPage - 1);
        showToast(`Página ${currentPage}`);
      } else {
        showToast("¡Primera página!");
      }
    }

    function toggleHUD() {
      areHudVisible = !areHudVisible;
      if (areHudVisible) {
        topHud.classList.remove('hud-hidden-top');
        bottomHud.classList.remove('hud-hidden-bottom');
        zoomControls.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        topHud.classList.add('hud-hidden-top');
        bottomHud.classList.add('hud-hidden-bottom');
        zoomControls.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    // Direct clicks on comic sheet advances page
    comicSheet.addEventListener('click', (e) => {
      e.stopPropagation();
      advanceNextPage();
    });

    // Clicking background toggles HUD
    const viewport = document.getElementById('reader-viewport');
    viewport.addEventListener('click', (e) => {
      if (e.target.closest('#comic-sheet') || e.target.closest('button') || e.target.closest('aside')) {
        return;
      }
      toggleHUD();
    });

    // Lateral floating navigation
    document.getElementById('btn-lateral-prev').addEventListener('click', (e) => {
      e.stopPropagation();
      retreatPrevPage();
    });

    document.getElementById('btn-lateral-next').addEventListener('click', (e) => {
      e.stopPropagation();
      advanceNextPage();
    });

    // Bottom HUD page buttons
    document.getElementById('btn-prev-page').addEventListener('click', (e) => {
      e.stopPropagation();
      retreatPrevPage();
    });

    document.getElementById('btn-next-page').addEventListener('click', (e) => {
      e.stopPropagation();
      advanceNextPage();
    });

    // Scrubber range input
    pageSlider.addEventListener('input', (e) => {
      updatePage(parseInt(e.target.value));
    });

    // Zoom Controls
    function applyZoom(val) {
      currentZoom = Math.min(Math.max(val, 0.75), 2.5);
      comicZoomContainer.style.transform = `scale(${currentZoom})`;
      document.getElementById('btn-zoom-reset').textContent = `${Math.round(currentZoom * 10) / 10}x`;
    }

    document.getElementById('btn-zoom-in').addEventListener('click', (e) => {
      e.stopPropagation();
      applyZoom(currentZoom + 0.25);
      showToast(`Zoom: ${Math.round(currentZoom * 100)}%`);
    });

    document.getElementById('btn-zoom-out').addEventListener('click', (e) => {
      e.stopPropagation();
      applyZoom(currentZoom - 0.25);
      showToast(`Zoom: ${Math.round(currentZoom * 100)}%`);
    });

    document.getElementById('btn-quick-zoom-in').addEventListener('click', (e) => {
      e.stopPropagation();
      applyZoom(currentZoom + 0.25);
      showToast(`Zoom: ${Math.round(currentZoom * 100)}%`);
    });

    document.getElementById('btn-quick-zoom-out').addEventListener('click', (e) => {
      e.stopPropagation();
      applyZoom(currentZoom - 0.25);
      showToast(`Zoom: ${Math.round(currentZoom * 100)}%`);
    });

    document.getElementById('btn-zoom-reset').addEventListener('click', (e) => {
      e.stopPropagation();
      applyZoom(1);
      showToast("Zoom: 100%");
    });

    // Autoplay feature
    btnAutoplay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!autoplayInterval) {
        autoplayInterval = setInterval(() => {
          if (currentPage < totalPages) {
            updatePage(currentPage + 1);
          } else {
            clearInterval(autoplayInterval);
            autoplayInterval = null;
            autoplayText.textContent = "AUTO";
            btnAutoplay.classList.replace('bg-[#ff2d78]', 'bg-[#00ff75]');
          }
        }, 3200);
        autoplayText.textContent = "PAUSA";
        btnAutoplay.classList.replace('bg-[#00ff75]', 'bg-[#ff2d78]');
        showToast("Auto-lectura iniciada");
      } else {
        clearInterval(autoplayInterval);
        autoplayInterval = null;
        autoplayText.textContent = "AUTO";
        btnAutoplay.classList.replace('bg-[#ff2d78]', 'bg-[#00ff75]');
        showToast("Auto-lectura pausada");
      }
    });

    // Fullscreen Toggle
    document.getElementById('btn-quick-fullscreen').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        showToast("Pantalla Completa");
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    });

    // Modal Events
    btnSettingsModal.addEventListener('click', () => {
      settingsModal.classList.remove('hidden');
    });

    document.getElementById('btn-open-grid').addEventListener('click', () => {
      settingsModal.classList.remove('hidden');
    });

    btnCloseModal.addEventListener('click', () => {
      settingsModal.classList.add('hidden');
    });

    modalBtnJump.addEventListener('click', () => {
      const val = parseInt(modalJumpInput.value);
      if (val >= 1 && val <= totalPages) {
        updatePage(val);
        settingsModal.classList.add('hidden');
        showToast(`Página ${val}`);
      }
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        advanceNextPage();
      } else if (e.key === 'ArrowLeft') {
        retreatPrevPage();
      } else if (e.key === 'f') {
        toggleHUD();
      }
    });

    // Initial setup on Page 1
    updatePage(1);
  });
</script>
<!-- END: Interactive Logic Scripts -->
</body></html>
